<script>
(function(){
  var KEY='rljpk_v1';
  window.loadProgress = function(){ try{ return JSON.parse(localStorage.getItem(KEY))||{q:{},s:{}} }catch(e){ return {q:{},s:{}} } };
  window.saveProgress = function(d){ localStorage.setItem(KEY, JSON.stringify(d)); };
  window.loadSyncCfg = function(){ try{ return JSON.parse(localStorage.getItem('rljpk_sync'))||{} }catch(e){ return {} } };
  window.saveSyncCfg = function(c){ localStorage.setItem('rljpk_sync', JSON.stringify(c)); };
  window.setSyncStatus = function(msg, cls){
    var el = document.getElementById('sync-state'); if(!el) return;
    el.textContent = msg; el.className = cls ? 'sync-'+cls : '';
  };
  function b64encode(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64){
    if(typeof b64 !== 'string' || !b64)
      throw new Error('云端返回内容缺失（content=' + (b64 === null ? 'null' : typeof b64) + '）——请点"立即同步"重试，若反复出现请把此提示反馈');
    var clean = String(b64).replace(/\s/g,'');
    var bin;
    try { bin = atob(clean); }
    catch(e){ throw new Error('云端返回了无法解码的内容（前 20 字符：' + clean.slice(0,20) + '）——请点"立即同步"重试，若反复出现请反馈'); }
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  window.mergeProgress = function(local, remote){
    var out = {q: Object.assign({}, local.q||{}), s: Object.assign({}, local.s||{})};
    Object.keys(remote.q||{}).forEach(function(k){
      var a = out.q[k], b = remote.q[k];
      if(!a){ out.q[k] = b; return; }
      out.q[k] = { ok: Math.max(a.ok||0, b.ok||0), first: Math.max(a.first||0, b.first||0), t: Math.max(a.t||0, b.t||0) };
    });
    Object.keys(remote.s||{}).forEach(function(k){
      var a = out.s[k], b = remote.s[k];
      if(!a){ out.s[k] = b; return; }
      var newer = (b.t||0) > (a.t||0) ? b : a;
      out.s[k] = { total: newer.total, right: Math.max(a.right||0, b.right||0), ok: !!(a.ok||b.ok), t: Math.max(a.t||0, b.t||0) };
    });
    return out;
  };
  var syncing = false, lastPullAt = 0, failCount = 0, pausedUntil = 0, conflictCount = 0;
  // 换绑/重绑后由配置界面调用：重置内部锁与失败状态，避免历史状态延续
  window.resetSyncState = function(){ syncing=false; failCount=0; pausedUntil=0; lastPullAt=0; conflictCount=0; };
  function apiHeaders(cfg){
    return {'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'};
  }
  // 双后端分派：cfg.backend = 'github'（默认）| 'gitee'
  function backendOf(cfg){ return cfg.backend === 'gitee' ? 'gitee' : 'github'; }
  function fileUrl(cfg, method){
    if(backendOf(cfg) === 'gitee')
      return method === 'PUT'
        ? 'https://gitee.com/api/v5/repos/'+cfg.repo+'/contents/progress.json'   // PUT 时令牌放请求体，不与 URL 重复
        : 'https://gitee.com/api/v5/repos/'+cfg.repo+'/contents/progress.json?access_token='+encodeURIComponent(cfg.token);
    return 'https://api.github.com/repos/'+cfg.repo+'/contents/progress.json';
  }
  function fetchOpts(cfg, method, bodyObj, useJson){
    var o = {method: method}, signal = null;
    if(typeof AbortController !== 'undefined'){
      var ac = new AbortController(); setTimeout(function(){ ac.abort(); }, 9000);
      signal = ac.signal; o.signal = signal;
    }
    if(backendOf(cfg) === 'gitee'){
      o.headers = {'Accept':'application/json'};
      if(method === 'PUT'){
        if(useJson){
          // Gitee JSON 姿势（社区实践中成功率高）：token/content/message 均入 JSON 体
          var j = {access_token: cfg.token, content: bodyObj.content, message: bodyObj.message || 'progress sync'};
          if(bodyObj.sha) j.sha = bodyObj.sha;
          o.headers['Content-Type'] = 'application/json;charset=UTF-8';
          o.body = JSON.stringify(j);
        } else {
          var params = new URLSearchParams();
          params.set('access_token', cfg.token);
          params.set('content', bodyObj.content);
          params.set('message', bodyObj.message || 'progress sync');
          if(bodyObj.sha) params.set('sha', bodyObj.sha);
          o.headers['Content-Type'] = 'application/x-www-form-urlencoded';
          o.body = params.toString();
        }
      }
    } else {
      o.headers = apiHeaders(cfg);
      if(method === 'PUT') o.body = JSON.stringify(bodyObj);
    }
    return o;
  }
  function netErrMsg(e, cfg){
    var m = e && e.message ? e.message : String(e);
    if(m.indexOf('abort') >= 0 || m.indexOf('Abort') >= 0)
      return '网络超时（9 秒无响应）' + (backendOf(cfg)==='github' ? '——GitHub 国内常无法直连，建议在上方切换为 Gitee 后端' : '，稍后重试');
    if(m.indexOf('fetch') >= 0 || m.indexOf('NetworkError') >= 0 || m.indexOf('network') >= 0)
      return '网络无法连通' + (backendOf(cfg)==='github' ? '——GitHub 国内常无法直连，建议切换为 Gitee 后端' : '，请检查网络');
    return m;
  }
  function noteFail(cfg, prefix){
    failCount++;
    if(failCount >= 3){
      pausedUntil = Date.now() + 5*60*1000; failCount = 0;
      setSyncStatus(prefix + '；自动同步已暂停 5 分钟，可点"立即同步"重试', 'err');
    } else {
      setSyncStatus(prefix, 'err');
    }
  }
  window.ghPush = function(force, useJson, isFallback){
    var cfg = loadSyncCfg(); if(!cfg.repo || !cfg.token || syncing) return;
    if(Date.now() < (pausedUntil||0)) return;
    var localStr = localStorage.getItem(KEY) || '{}';
    if(cfg.lastPushedHash === localStr && !force){ setSyncStatus('✓ 已与云端同步'); return; }
    syncing = true; setSyncStatus('☁ 正在上传进度…');
    var body = {message:'进度同步', content: b64encode(localStr)};
    if(cfg.sha) body.sha = cfg.sha;
    var tryJson = useJson !== false;  // 默认先 JSON（社区实践成功率高的姿势），失败自动换 form 再试一次
    fetch(fileUrl(cfg, 'PUT'), fetchOpts(cfg, 'PUT', body, tryJson))
    .then(function(r){ return r.text().then(function(t){ var j = null; try{ j = JSON.parse(t); }catch(e){} return {status:r.status, j:j, raw:t}; }); })
    .then(function(res){
      syncing = false;
      var errMsg = (res.j && (res.j.message || (res.j.messages && res.j.messages.join('; ')))) || (res.raw ? res.raw.slice(0, 100) : '') || '';
      if(res.status===200 || res.status===201){
        failCount = 0; pausedUntil = 0; conflictCount = 0;
        cfg.sha = (res.j.content && res.j.content.sha) || (res.j.commit && res.j.commit.sha) || res.j.sha || cfg.sha;
        cfg.lastPushedHash = localStr; cfg.lastSync = Date.now();
        saveSyncCfg(cfg); setSyncStatus('✓ 已同步到云端 '+new Date().toLocaleTimeString(), 'ok');
      } else if(backendOf(cfg)==='gitee' && res.status===400 && !isFallback){
        // 任何 400（含 sha 类错误）→ 先换另一种提交格式重试；两种格式都败才进入冲突/报错分支
        ghPush(true, !tryJson, true);
      } else if(res.status===409 || (backendOf(cfg)==='gitee' && res.status===400 && errMsg.indexOf('sha')>=0)){
        conflictCount++;
        if(conflictCount > 3){ setSyncStatus('✗ 上传反复冲突已停止（最后错误：'+errMsg+'）——请反馈此完整提示', 'err'); return; }
        cfg.sha = null; saveSyncCfg(cfg); ghPull(true);
      } else if(res.status===401 || res.status===403){
        noteFail(cfg, backendOf(cfg)==='gitee'
          ? '✗ 上传被拒绝（'+res.status+'）：Gitee 私人令牌可能未勾选 projects 权限或已过期——请重新生成一枚'
          : '✗ 上传被拒绝（'+res.status+'）：token 无效或权限不足，请重新配置');
      } else {
        noteFail(cfg, '✗ 上传失败：HTTP '+res.status+' '+errMsg);
      }
    }).catch(function(e){ syncing=false; noteFail(cfg, '✗ 上传失败：'+netErrMsg(e, cfg)); });
  };
  window.ghPull = function(force){
    var cfg = loadSyncCfg(); if(!cfg.repo || !cfg.token) return;
    if(Date.now() < (pausedUntil||0)){ setSyncStatus('⏸ 自动同步已暂停（此前连续失败），点"立即同步"重试'); return; }
    if(syncing) return;
    var now = Date.now();
    if(!force && now - (lastPullAt||0) < 30000) { ghPush(); return; }
    lastPullAt = now;
    syncing = true; setSyncStatus('☁ 正在检查云端进度…');
    fetch(fileUrl(cfg, 'GET'), fetchOpts(cfg, 'GET'))
    .then(function(r){
      if(r.status===404){ cfg.sha=null; saveSyncCfg(cfg); syncing=false; ghPush(); return null; }
      if(r.status===304){ syncing=false; return null; }
      if(r.status===401) throw new Error('令牌无效或已过期，请重新配置');
      if(r.status===403) throw new Error('API 限速或令牌权限不足');
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json().then(function(j){ return {status:200, j:j}; });
    })
    .then(function(res){
      if(!res) return;
      // Gitee 对不存在的文件返回 200+[]（GitHub 是 404）——都视为"云端还没有进度文件"，自动上传本地
      var missing = !res.j || Array.isArray(res.j) || typeof res.j.content !== 'string' || !res.j.content;
      if(missing){
        syncing = false; cfg.sha = null; saveSyncCfg(cfg);
        if(backendOf(cfg) === 'gitee'){
          // 空仓库（无任何分支/提交）无法通过 API 建文件——先查分支，空则给初始化指引
          var bqs = new URLSearchParams({access_token: cfg.token}).toString();
          fetch('https://gitee.com/api/v5/repos/'+cfg.repo+'/branches?'+bqs, {headers: {'Accept':'application/json'}})
          .then(function(r){ return r.json(); })
          .then(function(brs){
            if(Array.isArray(brs) && brs.length === 0)
              setSyncStatus('✗ 仓库是空的：请到 Gitee 打开该仓库 → 文件 → 新建 → 随便建一个 README.md 提交（初始化仓库），然后回来点"立即同步"', 'err');
            else ghPush();
          }).catch(function(){ ghPush(); });
        } else ghPush();
        return;
      }
      var remote = JSON.parse(b64decode(res.j.content));
      if(!remote || typeof remote !== 'object') throw new Error('云端进度数据格式异常，已忽略本次合并');
      var local = loadProgress();
      var merged = mergeProgress(local, remote);
      var localChanged = JSON.stringify(merged) !== JSON.stringify(local);
      cfg.sha = res.j.sha || null; saveSyncCfg(cfg);
      var afterSha = function(diag){
        saveSyncCfg(cfg);
        if(!cfg.sha && backendOf(cfg)==='gitee'){
          // 有文件却拿不到版本号——推送必然报 sha missing，不推，直接给诊断摘要
          syncing = false;
          setSyncStatus('✗ 无法获取云端文件版本号[' + (diag || 'GET响应无sha且文件树补取失败') + ']——点"诊断"按钮并把结果反馈', 'err');
          return;
        }
        if(localChanged){
          saveProgress(merged);
          if(typeof renderProgress === 'function') renderProgress();
          if(typeof renderDash === 'function') renderDash();
          if(typeof refreshBadge === 'function') refreshBadge();
        }
        if(JSON.stringify(merged) !== JSON.stringify(remote)){ syncing=false; ghPush(); }
        else { syncing=false; failCount=0; pausedUntil=0; setSyncStatus('✓ 已与云端同步', 'ok'); }
      };
      if(!cfg.sha && backendOf(cfg)==='gitee'){
        // Gitee 读文件响应可能不带 sha（API 创建的文件尤其如此）→ 更新必带 sha，否则报"sha is missing"。
        // 通过 仓库信息(default_branch) → 文件树(blob sha) 两步补取。
        var tq = new URLSearchParams({access_token: cfg.token}).toString();
        fetch('https://gitee.com/api/v5/repos/'+cfg.repo+'?'+tq, {headers: {'Accept':'application/json'}})
        .then(function(r){ return r.json(); })
        .then(function(ri){
          var br = (ri && ri.default_branch) || 'master';
          return fetch('https://gitee.com/api/v5/repos/'+cfg.repo+'/git/trees/'+br+'?'+tq, {headers: {'Accept':'application/json'}}).then(function(r2){ return r2.json(); })
            .then(function(t){
              var hit = null;
              if(t && t.tree) for(var i=0;i<t.tree.length;i++) if(t.tree[i].path === 'progress.json'){ hit = t.tree[i].sha; break; }
              return {branch: br, hit: hit, treeLen: (t && t.tree) ? t.tree.length : 0, paths: (t && t.tree) ? t.tree.slice(0,8).map(function(x){return x.path;}).join(',') : ''};
            });
        })
        .then(function(d){
          if(d.hit) cfg.sha = d.hit;
          afterSha('分支=' + d.branch + ';树内项数=' + d.treeLen + ';找到progress.json=' + (d.hit ? '是' : '否') + ';树内前8项=' + d.paths);
        })
        .catch(function(e){ afterSha('补取异常:' + (e && e.message || e)); });  // 补取失败不推
      } else afterSha('GET响应自带sha');
    }).catch(function(e){
      syncing=false;
      var m = e && e.message ? e.message : '';
      if(m.indexOf('令牌') >= 0 || m.indexOf('限速') >= 0 || m.indexOf('格式异常') >= 0) noteFail(cfg, '✗ 拉取失败：'+m);
      else noteFail(cfg, '✗ 拉取失败：'+netErrMsg(e, cfg));
    });
  };
  var syncTimer = null;
  var syncTimer = null, lastSavedStr = null;
  // 一键诊断：三个只读请求（读文件/仓库信息/文件树），输出摘要并尝试复制到剪贴板
  window.runSyncDiag = function(){
    var cfg = loadSyncCfg();
    if(!cfg.repo || !cfg.token){ setSyncStatus('请先配置并连接云同步', 'err'); return; }
    setSyncStatus('正在诊断…');
    var tq = new URLSearchParams({access_token: cfg.token}).toString();
    var base = backendOf(cfg)==='gitee' ? 'https://gitee.com/api/v5' : 'https://api.github.com';
    var out = ['后端=' + backendOf(cfg), '仓库=' + cfg.repo];
    var req = function(url, hdrs){
      return fetch(url, {headers: hdrs || {'Accept':'application/json'}})
        .then(function(r){ return r.text().then(function(t){ return {s: r.status, t: t}; }); });
    };
    var hdrs = backendOf(cfg)==='gitee' ? {'Accept':'application/json'} : {'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json'};
    Promise.all([
      req(base + '/repos/' + cfg.repo + '/contents/progress.json' + (backendOf(cfg)==='gitee' ? '?' + tq : ''), hdrs),
      backendOf(cfg)==='gitee'
        ? req(base + '/repos/' + cfg.repo + '?' + tq).then(function(ri){
            var br = 'master'; try { br = JSON.parse(ri.t).default_branch || 'master'; } catch(e){}
            return req(base + '/repos/' + cfg.repo + '/git/trees/' + br + '?' + tq).then(function(tr){
              return {branch: br, tr: tr};
            });
          })
        : Promise.resolve(null)
    ]).then(function(r){
      var c = r[0], tree = r[1];
      out.push('读文件HTTP=' + c.s, '读文件响应前160字符=' + c.t.slice(0, 160));
      if(tree){
        out.push('默认分支=' + tree.branch, '文件树HTTP=' + tree.tr.s);
        var items = []; try { items = JSON.parse(tree.tr.t).tree || []; } catch(e){}
        var pj = items.filter(function(x){ return x.path === 'progress.json'; })[0];
        out.push('树内文件数=' + items.length, '树内progress.json=' + (pj ? ('找到,sha=' + pj.sha) : '未找到'), '树内全部路径=' + items.map(function(x){return x.path;}).join('|'));
      }
      var msg = out.join('\n');
      setSyncStatus('诊断完成，结果已复制（粘贴发给老师）', 'ok');
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).catch(function(){});
      window.__syncDiag = msg;
      console.log(msg);
    }).catch(function(e){
      setSyncStatus('诊断失败：' + (e && e.message || e), 'err');
    });
  };
  window.scheduleSync = function(savedStr){
    if(savedStr != null) lastSavedStr = savedStr;
    var cfg = loadSyncCfg(); if(!cfg.repo || !cfg.token) return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncTimer=null; ghPull(true); }, 3000);
  };
  window.addEventListener('focus', function(){ ghPull(); });
  window.addEventListener('pageshow', function(e){ if(e.persisted) ghPull(); });
  ghPull();  // 页面加载时即与云端对账（新设备在此恢复进度）
})();


(function(){
  // 事件委托版：绑定挂在 document 上，任何时刻点汉堡都有效（按钮重渲染/监听丢失不影响）
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t.closest && t.closest('.sb-btn')) { document.body.classList.toggle('sb-open'); return; }
    if (t.closest && t.closest('.sb-mask')) { document.body.classList.remove('sb-open'); return; }
    if (t.closest && t.closest('.sidebar a')) { document.body.classList.remove('sb-open'); }
  });
})();
</script>
<script src="quiz_app.js"></script>
